            <style>
                .background {
                    fill: #fff;
                }

                .frame {
                    fill: none;
                    stroke: #ccc;
                }

                .grid {
                    fill: none;
                    stroke: lightgray;
                }

                .axis {
                    stroke: #000;
                    fill: none;
                }

                .label {
                    font-size: 12px;
                    text-anchor: middle;
                    dominant-baseline: middle;
                }

                .tick {
                    font-size: 10px;
                    text-anchor: end;
                    dominant-baseline: middle;
                }
				
                .s1 {
                    --c: #34D399;
                }

                .s2 {
                    --c: #C8A2C8;
                }

                .s3 {
                    --c: #00CFE8;
                }

                .s4 {
                    --c: #F062B5;
                }

                .series {
                    fill: var(--c);
                    stroke: var(--c);
                    transition: opacity 0.4s;
                }

                .series circle {
                    stroke: none;
                }

                .area {
                    fill-opacity: 0.5;
                    stroke-width: 1.5;
                    transition:
                        fill-opacity 0.4s,
                        stroke-width 0.4s;
                }

                .legend-item {
                    cursor: pointer;
                    transition: opacity 0.4s;
                }

                .legend-item rect {
                    width: 15px;
                    height: 15px;
                    fill: var(--c);
                }

                .legend-text {
                    font-size: 10px;
                }

                .legend-title {
                    font-size: 12px;
                    font-weight: bold;
                }

                svg:has(.s1:hover) .series.s1 .area,
                svg:has(.s2:hover) .series.s2 .area,
                svg:has(.s3:hover) .series.s3 .area,
                svg:has(.s4:hover) .series.s4 .area {
                    fill-opacity: 0.8;
                    stroke-width: 2.5;
                }


                svg:has(.s1:hover) .series:not(.s1),

                svg:has(.s3:hover) .series:not(.s3),
                svg:has(.s4:hover) .series:not(.s4),
