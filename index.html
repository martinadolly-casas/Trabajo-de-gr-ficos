<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparación de universidades chilenas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Lexend", sans-serif;
        }
    </style>
</head>

<body>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1005"
    height="600"
    viewBox="0 0 1005 600"
>

    <style>
        .background {
            fill: #fff;
        }

        .frame {
            fill: none;
            stroke: #ccc;
        }

        .grid {
            fill: none;
            stroke: lightgray;
        }

        .axis {
            stroke: #000;
            fill: none;
        }

        .label {
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .tick {
            font-size: 10px;
            text-anchor: end;
            dominant-baseline: middle;
        }

        /* Colores de las universidades */
        .s1 {
            --c: #34D399;
        }

        .s2 {
            --c: #C8A2C8;
        }

        .s3 {
            --c: #00CFE8;
        }

        .s4 {
            --c: #F062B5;
        }

        .series {
            fill: var(--c);
            stroke: var(--c);
            transition: opacity 0.4s;
        }

        .series circle {
            stroke: none;
        }

        .area {
            fill-opacity: 0.5;
            stroke-width: 1.5;
            transition:
                fill-opacity 0.4s,
                stroke-width 0.4s;
        }

        .legend-item {
            cursor: pointer;
            transition: opacity 0.4s;
        }

        .legend-item rect {
            width: 15px;
            height: 15px;
            fill: var(--c);
        }

        .legend-text {
            font-size: 10px;
        }

        .legend-title {
            font-size: 12px;
            font-weight: bold;
        }

        /* Resaltar la universidad seleccionada */
        svg:has(.s1:hover) .series.s1 .area,
        svg:has(.s2:hover) .series.s2 .area,
        svg:has(.s3:hover) .series.s3 .area,
        svg:has(.s4:hover) .series.s4 .area {
            fill-opacity: 0.8;
            stroke-width: 2.5;
        }

        /* Atenuar las otras universidades */
        svg:has(.s1:hover) .series:not(.s1),
        svg:has(.s2:hover) .series:not(.s2),
        svg:has(.s3:hover) .series:not(.s3),
        svg:has(.s4:hover) .series:not(.s4),
        svg:has(.s1:hover) .legend-item:not(.s1),
        svg:has(.s2:hover) .legend-item:not(.s2),
        svg:has(.s3:hover) .legend-item:not(.s3),
        svg:has(.s4:hover) .legend-item:not(.s4) {
            opacity: 0.2;
        }
    </style>

    <!-- Fondo y marco -->
    <rect class="background" width="1005" height="600"/>
    <rect class="frame" width="805" height="600"/>

    <!-- GRÁFICO RADAR -->
    <g transform="translate(335 315)">

        <!-- Cuadrícula -->
        <g class="grid">
            <circle r="28.5"/>
            <circle r="57"/>
            <circle r="85.5"/>
            <circle r="114"/>
            <circle r="142.5"/>
            <circle r="171"/>
            <circle r="199.5"/>
            <circle r="228"/>
            <circle r="256.5"/>
        </g>

        <!-- Ejes -->
        <g class="axis">
            <line x2="0" y2="-285"/>
            <line x2="271.05" y2="-88.07"/>
            <line x2="167.52" y2="230.57"/>
            <line x2="-167.52" y2="230.57"/>
            <line x2="-271.05" y2="-88.07"/>
        </g>

        <!-- Indicadores en español -->
        <g>
            <text class="label" x="0" y="-295">
                Personal con doctorado
            </text>

            <text class="label" x="280.56" y="-91.16">
                Estudiantes por facultad
            </text>

            <text class="label" x="173.4" y="238.66">
                Red internacional de investigación
            </text>

            <text class="label" x="-173.4" y="238.66">
                Papers por facultad
            </text>

            <text class="label" x="-280.56" y="-91.16">
                Citas por publicación
            </text>
        </g>

        <!-- Escala -->
        <g class="tick">
            <path class="axis" d="M-6-285H0V0H-6"/>

            <text x="-9" y="0">0</text>
            <text x="-9" y="-28.5">10</text>
            <text x="-9" y="-57">20</text>
            <text x="-9" y="-85.5">30</text>
            <text x="-9" y="-114">40</text>
            <text x="-9" y="-142.5">50</text>
            <text x="-9" y="-171">60</text>
            <text x="-9" y="-199.5">70</text>
            <text x="-9" y="-228">80</text>
            <text x="-9" y="-256.5">90</text>
        </g>

        <!-- PONTIFICIA UNIVERSIDAD CATÓLICA DE CHILE -->
        <g class="series s1">
            <title>Pontificia Universidad Católica de Chile</title>

            <polygon
                class="area"
                points="0,-281 194.97,-63.35 166.93,229.76 -163.4,224.91 -210.18,-68.29"
            />

            <circle cx="0" cy="-281" r="1"/>
            <circle cx="194.97" cy="-63.35" r="1"/>
            <circle cx="166.93" cy="229.76" r="1"/>
            <circle cx="-163.4" cy="224.91" r="1"/>
            <circle cx="-210.18" cy="-68.29" r="1"/>
        </g>

        <!-- UNIVERSIDAD DE CHILE -->
        <g class="series s2">
            <title>Universidad de Chile</title>

            <polygon
                class="area"
                points="0,-205 62.77,-20.4 166.93,229.76 -166.93,229.76 -208.28,-67.67"
            />

            <circle cx="0" cy="-205" r="1"/>
            <circle cx="62.77" cy="-20.4" r="1"/>
            <circle cx="166.93" cy="229.76" r="1"/>
            <circle cx="-166.93" cy="229.76" r="1"/>
            <circle cx="-208.28" cy="-67.67" r="1"/>
        </g>

        <!-- UNIVERSIDAD DE CONCEPCIÓN -->
        <g class="series s3">
            <title>Universidad de Concepción</title>

            <polygon
                class="area"
                points="0,-182 101.76,-33.06 165.76,228.14 -149.89,206.3 -238.72,-77.56"
            />

            <circle cx="0" cy="-182" r="1"/>
            <circle cx="101.76" cy="-33.06" r="1"/>
            <circle cx="165.76" cy="228.14" r="1"/>
            <circle cx="-149.89" cy="206.3" r="1"/>
            <circle cx="-238.72" cy="-77.56" r="1"/>
        </g>

        <!-- UNIVERSIDAD DE SANTIAGO DE CHILE -->
        <g class="series s4">
            <title>Universidad de Santiago de Chile</title>

            <polygon
                class="area"
                points="0,-84 80.84,-26.27 163.99,225.72 -135.78,186.88 -165.48,-53.77"
            />

            <circle cx="0" cy="-84" r="1"/>
            <circle cx="80.84" cy="-26.27" r="1"/>
            <circle cx="163.99" cy="225.72" r="1"/>
            <circle cx="-135.78" cy="186.88" r="1"/>
            <circle cx="-165.48" cy="-53.77" r="1"/>
        </g>

    </g>

    <!-- LEYENDA -->
    <g transform="translate(810 30)">

        <text class="legend-title">
            Nombre de la institución
        </text>

        <!-- PUC -->
        <g class="legend-item s1" transform="translate(0 16)">
            <rect/>

            <text class="legend-text" x="20" y="12.5">
                <tspan x="20">Pontificia Universidad</tspan>
                <tspan x="20" dy="1.2em">Católica de Chile (PUC)</tspan>
            </text>
        </g>

        <!-- Universidad de Chile -->
        <g class="legend-item s2" transform="translate(0 52.6)">
            <rect/>

            <text class="legend-text" x="20" y="12.5">
                Universidad de Chile (UChile)
            </text>
        </g>

        <!-- Universidad de Concepción -->
        <g class="legend-item s3" transform="translate(0 73.6)">
            <rect/>

            <text class="legend-text" x="20" y="12.5">
                Universidad de Concepción (UdeC)
            </text>
        </g>

        <!-- Universidad de Santiago -->
        <g class="legend-item s4" transform="translate(0 94.6)">
            <rect/>

            <text class="legend-text" x="20" y="12.5">
                <tspan x="20">Universidad de Santiago de</tspan>
                <tspan x="20" dy="1.2em">Chile (Usach)</tspan>
            </text>
        </g>

    </g>

</svg>

</body>
</html>
